<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISS Tracker Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <style>
    html,
    body {
      height: 100%;
    }

    #map {
      min-height: 60vh;
      height: 100%;
      width: 100%;
    }

    .leaflet-container {
      background: #05070d;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-cyan-500/40">
  <div class="relative min-h-screen overflow-hidden">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(56,189,248,0.15),transparent_35%),radial-gradient(circle_at_80%_10%,rgba(14,116,144,0.15),transparent_30%),radial-gradient(circle_at_50%_100%,rgba(15,23,42,0.85),rgba(2,6,23,1))]"></div>

    <main class="relative z-10 grid min-h-screen grid-cols-1 lg:grid-cols-[1fr_360px]">
      <section class="p-4 lg:p-6">
        <div class="h-full overflow-hidden rounded-2xl border border-slate-700/70 bg-slate-900/50 shadow-[0_0_40px_rgba(14,116,144,0.25)]">
          <div id="map" role="application" aria-label="ISS world map"></div>
        </div>
      </section>

      <aside class="border-t border-slate-800/80 bg-slate-950/80 backdrop-blur lg:border-l lg:border-t-0">
        <div class="flex h-full flex-col gap-6 p-6">
          <header>
            <p class="text-xs uppercase tracking-[0.25em] text-cyan-300/70">Orbit Monitor</p>
            <h1 class="mt-2 text-2xl font-semibold text-slate-100">ISS Tracker Live</h1>
            <p class="mt-2 text-sm text-slate-400">Live telemetry from Open Notify</p>
          </header>

          <section class="space-y-4 rounded-xl border border-slate-800 bg-slate-900/70 p-4">
            <div>
              <p class="text-xs uppercase tracking-wider text-slate-400">Status</p>
              <p id="status" class="mt-1 text-sm font-medium text-amber-300">Initializing...</p>
              <p id="statusMessage" class="mt-1 text-xs text-slate-500"></p>
            </div>

            <div>
              <p class="text-xs uppercase tracking-wider text-slate-400">Latitude</p>
              <p id="latitude" class="mt-1 text-xl font-semibold text-cyan-200">--</p>
            </div>

            <div>
              <p class="text-xs uppercase tracking-wider text-slate-400">Longitude</p>
              <p id="longitude" class="mt-1 text-xl font-semibold text-cyan-200">--</p>
            </div>

            <div>
              <p class="text-xs uppercase tracking-wider text-slate-400">Last Updated</p>
              <p id="updatedAt" class="mt-1 text-sm text-slate-300">--</p>
            </div>
          </section>

          <section class="rounded-xl border border-slate-800 bg-slate-900/50 p-4 text-xs text-slate-400">
            <p>Source: <code class="text-cyan-300">Open Notify (HTTPS-safe proxy on secure pages)</code></p>
            <p class="mt-2">Polling interval: <span class="text-slate-200">5 seconds</span></p>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const OPEN_NOTIFY_URL = "http://api.open-notify.org/iss-now.json";
    const OPEN_NOTIFY_PROXY_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(OPEN_NOTIFY_URL)}`;
    const ISS_API_ENDPOINTS =
      window.location.protocol === "https:"
        ? [OPEN_NOTIFY_PROXY_URL]
        : [OPEN_NOTIFY_URL, OPEN_NOTIFY_PROXY_URL];

    const POLL_INTERVAL_MS = 5000;
    const MARKER_ANIMATION_MS = 4500;

    const statusEl = document.getElementById("status");
    const statusMessageEl = document.getElementById("statusMessage");
    const latitudeEl = document.getElementById("latitude");
    const longitudeEl = document.getElementById("longitude");
    const updatedAtEl = document.getElementById("updatedAt");

    const map = L.map("map", {
      zoomControl: true,
      worldCopyJump: true,
      preferCanvas: true,
    }).setView([20, 0], 2);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: "abcd",
      maxZoom: 19,
    }).addTo(map);

    const satelliteSvg = encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
        <circle cx='32' cy='32' r='6' fill='#22d3ee' />
        <rect x='26' y='20' width='12' height='24' rx='2' fill='#67e8f9' />
        <rect x='4' y='24' width='20' height='8' rx='2' fill='#0ea5e9' />
        <rect x='40' y='24' width='20' height='8' rx='2' fill='#0ea5e9' />
        <rect x='30' y='8' width='4' height='12' fill='#a5f3fc' />
        <circle cx='32' cy='32' r='30' fill='none' stroke='rgba(34,211,238,0.25)' stroke-width='2'/>
      </svg>
    `);

    const issIcon = L.icon({
      iconUrl: `data:image/svg+xml;charset=UTF-8,${satelliteSvg}`,
      iconSize: [44, 44],
      iconAnchor: [22, 22],
      className: "iss-marker",
    });

    let issMarker = null;
    let previousPosition = null;
    let animationFrameId = null;
    let isFetching = false;

    function setStatus(kind, message = "") {
      const palette = {
        connected: "text-emerald-300",
        updating: "text-cyan-300",
        error: "text-rose-300",
        init: "text-amber-300",
      };

      const labels = {
        connected: "Connected",
        updating: "Updating",
        error: "Error",
        init: "Initializing...",
      };

      statusEl.className = `mt-1 text-sm font-medium ${palette[kind] || palette.init}`;
      statusEl.textContent = labels[kind] || labels.init;
      statusMessageEl.textContent = message;
    }

    function updatePanel({ lat, lng, timestamp }) {
      latitudeEl.textContent = lat.toFixed(5);
      longitudeEl.textContent = lng.toFixed(5);
      updatedAtEl.textContent = new Date(timestamp * 1000).toLocaleString();
    }

    function animateMarker(fromLatLng, toLatLng, durationMs) {
      if (!issMarker) return;

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }

      const currentBounds = map.getBounds().pad(0.2);
      if (!currentBounds.contains([toLatLng.lat, toLatLng.lng])) {
        map.panTo([toLatLng.lat, toLatLng.lng], { animate: true });
      }

      const start = performance.now();
      let deltaLng = toLatLng.lng - fromLatLng.lng;

      if (deltaLng > 180) {
        deltaLng -= 360;
      } else if (deltaLng < -180) {
        deltaLng += 360;
      }

      function step(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / durationMs, 1);

        const lat = fromLatLng.lat + (toLatLng.lat - fromLatLng.lat) * progress;
        let lng = fromLatLng.lng + deltaLng * progress;

        if (lng > 180) {
          lng -= 360;
        } else if (lng < -180) {
          lng += 360;
        }

        issMarker.setLatLng({ lat, lng });

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(step);
        } else {
          animationFrameId = null;
        }
      }

      animationFrameId = requestAnimationFrame(step);
    }

    async function fetchIssPosition() {
      let lastError = null;

      for (const endpoint of ISS_API_ENDPOINTS) {
        try {
          const response = await fetch(endpoint, { cache: "no-store" });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          if (
            data.message !== "success" ||
            !data.iss_position ||
            typeof data.iss_position.latitude === "undefined" ||
            typeof data.iss_position.longitude === "undefined"
          ) {
            throw new Error("Unexpected API response");
          }

          const lat = Number.parseFloat(data.iss_position.latitude);
          const lng = Number.parseFloat(data.iss_position.longitude);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            throw new Error("Invalid coordinates");
          }

          return {
            lat,
            lng,
            timestamp: Number(data.timestamp || Math.floor(Date.now() / 1000)),
          };
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error("Unable to fetch ISS data");
    }

    async function refreshIss() {
      if (isFetching) return;
      isFetching = true;

      try {
        setStatus("updating", "Fetching latest ISS position...");
        const nextPosition = await fetchIssPosition();

        updatePanel(nextPosition);

        if (!issMarker) {
          issMarker = L.marker([nextPosition.lat, nextPosition.lng], { icon: issIcon }).addTo(map);
          map.setView([nextPosition.lat, nextPosition.lng], 4);
        } else if (previousPosition) {
          animateMarker(previousPosition, nextPosition, MARKER_ANIMATION_MS);
        }

        previousPosition = { lat: nextPosition.lat, lng: nextPosition.lng };
        setStatus("connected", "Live ISS telemetry streaming");
      } catch (error) {
        const message = error instanceof Error ? error.message : "Unable to fetch ISS data";
        setStatus(
          "error",
          `Request failed. Endpoint unavailable or blocked by browser policy. (${message})`
        );
      } finally {
        isFetching = false;
      }
    }

    setStatus("init", "Bootstrapping map and telemetry");
    refreshIss();
    setInterval(refreshIss, POLL_INTERVAL_MS);
  </script>
</body>
</html>
